version: '3.8'

services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  db:
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=digdug_db
    ports:
      - "5432:5432"

  coordinator:
    build: ./coordinator
    ports:
      - "8308:8308"
    volumes:
      - ./coordinator:/app
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DATABASE_URL=postgresql://user:password@db:5432/digdug_db
    depends_on:
      - redis
      - db

  agent:
    build: ./agent
    volumes:
      - ./agent:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - COORDINATOR_URL=http://coordinator:5000/api/v1/results
    depends_on:
      - coordinator
      - redis

volumes:
  postgres_data:
